[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-gen"
version = "0.1.0"
description = "CP-GEN: cluster-aware characterization of variant burden in underrepresented populations"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Core data science
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",

    # Machine learning
    "scikit-learn>=1.4",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # Jupyter
    "jupyterlab>=4.1",
    "notebook>=7.1",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
]

# This repo is a notebook collection, not an importable package. Declaring no
# modules keeps `pip install -e .` a dependency-only install and stops
# setuptools from auto-discovering `notebooks/` as a package.
[tool.setuptools]
py-modules = []
